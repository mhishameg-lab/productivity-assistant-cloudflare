name = "productivity-assistant-production"
main = "src/index.js"
compatibility_date = "2026-11-22"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "productivity-assistant-production"
database_id = "a5b51e55-88d7-4aee-b432-163c27655e9c"
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
DEPLOYMENT_STAGE = "production"
ASSISTANT_ENABLED = "true"
SCHEDULED_JOBS_ENABLED = "true"
TELEGRAM_WEBHOOK_CUTOVER_ENABLED = "false"
TELEGRAM_WEBHOOK_URL = "https://productivity-assistant-production.mhisham-eg.workers.dev/webhooks/telegram"
GOOGLE_CALENDAR_ENABLED = "false"
GOOGLE_CALENDAR_WRITES_ENABLED = "false"
GOOGLE_GMAIL_ENABLED = "true"
GOOGLE_GMAIL_READ_ENABLED = "true"
GMAIL_AI_ANALYSIS_ENABLED = "true"
EMAIL_ESCALATIONS_ENABLED = "true"
TASK_REMINDERS_ENABLED = "true"
CALENDAR_REMINDERS_ENABLED = "false"
PUBLIC_BASE_URL = "https://productivity-assistant-production.mhisham-eg.workers.dev"
MINI_APP_ENABLED = "false"
WORK_PULSES_ENABLED = "true"
HTML_EMAILS_ENABLED = "false"
COMPANION_ENABLED = "true"
USER_REMINDERS_ENABLED = "true"
AI_ENABLED = "true"
AI_FREE_PLAN_CONFIRMED = "true"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_DAILY_NEURON_LIMIT = "5000"

[triggers]
crons = ["*/5 * * * *"]

